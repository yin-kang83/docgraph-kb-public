# 法学元知识：10 个试点概念（中华人民共和国民法典）
# definition 为转述；source_quote 为条文摘录；均标 source/article。
- id: concept.civil_right_capacity
  term: 民事权利能力
  definition: 自然人从出生时起到死亡时止，依法享有民事权利、承担民事义务的资格。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第十三条
  source_quote: 自然人从出生时起到死亡时止，具有民事权利能力，依法享有民事权利，承担民事义务。
  source_url: https://www.12371.cn/2020/06/01/ARTI1591021670041266.shtml
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.civil_conduct_capacity
  term: 民事行为能力
  definition: 自然人以自己的行为独立实施民事法律行为、取得民事权利和承担民事义务的资格；依年龄与辨认能力分为完全、限制、无民事行为能力。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第十七条至第二十二条
  source_quote: 十八周岁以上的自然人为成年人。成年人为完全民事行为能力人，可以独立实施民事法律行为。八周岁以上的未成年人为限制民事行为能力人；不满八周岁的未成年人为无民事行为能力人。
  source_url: https://www.12371.cn/2020/06/01/ARTI1591021670041266.shtml
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.intention_expression
  term: 意思表示
  definition: 行为人把意欲发生一定民事法律效果的意思表达于外部；有相对人的表示到达时生效，无相对人的表示完成时生效。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第一百三十七条、第一百三十八条
  source_quote: 以非对话方式作出的意思表示，到达相对人时生效。无相对人的意思表示，表示完成时生效。
  source_url: https://www.12371.cn/2020/06/01/ARTI1591021670041266.shtml
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.agency
  term: 代理
  definition: 民事主体通过代理人实施民事法律行为；代理人在代理权限内、以被代理人名义实施的行为，对被代理人发生效力。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第一百六十一条、第一百六十二条
  source_quote: 民事主体可以通过代理人实施民事法律行为。代理人在代理权限内，以被代理人名义实施的民事法律行为，对被代理人发生效力。
  source_url: https://www.12371.cn/2020/06/01/ARTI1591021670041266.shtml
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.good_faith_acquisition
  term: 善意取得
  definition: 无处分权人转让不动产或动产，受让人善意、以合理价格受让，且依法完成登记或交付的，受让人取得所有权。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第三百一十一条
  source_quote: 无处分权人将不动产或者动产转让给受让人的，所有权人有权追回；除法律另有规定外，符合下列情形的，受让人取得该不动产或者动产的所有权：（一）受让人受让该不动产或者动产时是善意；（二）以合理的价格转让；（三）转让的不动产或者动产依照法律规定应当登记的已经登记，不需要登记的已经交付给受让人。
  source_url: http://www.msjcy.gov.cn/info/1164/4436.htm
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.unjust_enrichment
  term: 不当得利
  definition: 得利人没有法律根据取得不当利益，受损失的人可以请求返还；履行道德义务、提前清偿、明知无给付义务而清偿等除外。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第九百八十五条
  source_quote: 得利人没有法律根据取得不当利益的，受损失的人可以请求得利人返还取得的利益，但是有下列情形之一的除外：（一）为履行道德义务进行的给付；（二）债务到期之前的清偿；（三）明知无给付义务而进行的债务清偿。
  source_url: http://www.msjcy.gov.cn/info/1164/5728.htm
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.negotiorum_gestio
  term: 无因管理
  definition: 管理人没有法定或约定义务，为避免他人利益受损失而管理他人事务，可以请求受益人偿还必要费用或适当补偿。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第九百七十九条
  source_quote: 管理人没有法定的或者约定的义务，为避免他人利益受损失而管理他人事务的，可以请求受益人偿还因管理事务而支出的必要费用；管理人因管理事务受到损失的，可以请求受益人给予适当补偿。
  source_url: http://www.msjcy.gov.cn/info/1164/5708.htm
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.breach_liability
  term: 违约责任
  definition: 当事人一方不履行合同义务或履行不符合约定，应承担继续履行、采取补救措施或赔偿损失等违约责任。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第五百七十七条
  source_quote: 当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。
  source_url: http://www.msjcy.gov.cn/info/1164/5083.htm
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.tort_liability
  term: 侵权责任
  definition: 行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任；法律规定推定过错且不能证明无过错的，亦同。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第一千一百六十五条
  source_quote: 行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。依照法律规定推定行为人有过错，其不能证明自己没有过错的，应当承担侵权责任。
  source_url: http://www.msjcy.gov.cn/info/1164/6342.htm
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []

- id: concept.limitation
  term: 诉讼时效
  definition: 向人民法院请求保护民事权利的期间为三年；自权利人知道或应当知道权利受损害及义务人之日起算，最长不超过二十年。
  definition_type: paraphrase
  source: 中华人民共和国民法典
  article: 第一百八十八条
  source_quote: 向人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规定。诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。但是，自权利受到损害之日起超过二十年的，人民法院不予保护。
  source_url: http://www.msjcy.gov.cn/info/1164/4320.htm
  jurisdiction: CN
  effective_date: "2021-01-01"
  relations: []
